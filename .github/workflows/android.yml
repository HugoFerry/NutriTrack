name: Build Android APK

on:
  push:
    branches: ['**']
    # Config Claude Code et vidéo promo : sans effet sur l'APK, pas de build pour un push qui ne touche qu'eux.
    paths-ignore:
      - '.claude/**'
      - 'promo/**'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install
        run: npm ci

      - name: Tests & typecheck
        run: |
          npm run typecheck
          npm test

      - name: Build web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing (release keystore from secrets, sinon debug)
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../NutriTrack.apk
            cp app/build/outputs/bundle/release/app-release.aab ../NutriTrack.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../NutriTrack.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-${{ steps.sign.outputs.mode }}-apk
          path: NutriTrack.apk
          retention-days: 30

      - name: Upload AAB (Play Console, tests internes)
        if: steps.sign.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: NutriTrack-release-aab
          path: NutriTrack.aab
          retention-days: 30
